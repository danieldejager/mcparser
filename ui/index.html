<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>McParser</title>
  <link rel="stylesheet" href="studio.css">
</head>
<body>
  <header id="toolbar">
    <div class="tb-group">
    <button id="tb-open" type="button" class="icon" title="Open Collection" aria-label="Open Collection">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="#f2c94c" d="M1 4h5l1.5 1.5H15V13H1z"/><path fill="#f6d56b" d="M1 5.5h14V13H1z"/><path fill="#e0a82e" d="M1 4h5l1 1H1z"/></svg>
    </button>
    <button id="tb-new" type="button" class="icon" title="New Query" aria-label="New Query">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="#fff" stroke="#555" d="M3 1h7l3 3v11H3z"/><path fill="#f2c94c" d="M10 1v3h3"/><path fill="#f2c94c" d="M8 5l.7 1.6 1.8.2-1.3 1.2.4 1.8L8 9l-1.6.8.4-1.8-1.3-1.2 1.8-.2z"/></svg>
    </button>
    <button id="tb-save" type="button" class="icon" title="Save" aria-label="Save">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="#2f6db5" d="M2 2h9l3 3v9H2z"/><path fill="#fff" d="M4 2h6v4H4z"/><path fill="#d6e6f7" d="M4 9h8v5H4z"/><path fill="#2f6db5" d="M5 10h6v1H5zM5 12h6v1H5z"/></svg>
    </button>
    <button id="tb-save-all" type="button" class="icon" title="Save all" aria-label="Save all">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="#8fb4dd" d="M4 1h7l2 2v9H4z"/><path fill="#2f6db5" d="M2 4h9l2 2v8H2z"/><path fill="#fff" d="M4 4h5v3H4z"/><path fill="#d6e6f7" d="M4 9h7v4H4z"/></svg>
    </button>
    <button id="tb-run" type="button" class="icon" title="Execute" aria-label="Execute">▶</button>
    </div>
    <span class="tb-sep"></span>
    <div class="tb-group">
    <button id="tb-ioc" type="button" class="icon" title="IOC Management" aria-label="IOC Management">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="none" stroke="#b42318" stroke-width="1.4"/><circle cx="8" cy="8" r="2" fill="none" stroke="#b42318" stroke-width="1.4"/><circle cx="8" cy="8" r="0.8" fill="#b42318"/><path stroke="#b42318" stroke-width="1.4" d="M8 1.2v2.2M8 12.6v2.2M1.2 8h2.2M12.6 8h2.2"/></svg>
    </button>
    <button id="tb-grok" type="button" class="icon" title="Grok" aria-label="Grok">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#111" d="M4 7.2c2.4-3.6 7.2-4.4 10.2-1.8 1.4 1.2 2.2 2.8 2.4 4.4-2.2.2-4.2 1.2-5.6 2.8-1.2 1.4-1.8 3.2-1.6 5-2.6-.2-5-1.6-6.2-4-1.4-2.6-1.2-5.6.8-6.4zm8.8 6.2c1.6-1.4 3.6-2 5.6-1.6-.2 2-.8 3.6-2 4.8-1.6 1.6-3.8 2.2-5.8 1.6.4-1.8.8-3.4 2.2-4.8z"/></svg>
    </button>
    <button id="tb-claude" type="button" class="icon" title="Claude" aria-label="Claude">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#D97757" d="m4.7144 15.9555 4.7174-2.6471.079-.2307-.079-.1275h-.2307l-.7893-.0486-2.6956-.0729-2.3375-.0971-2.2646-.1214-.5707-.1215-.5343-.7042.0546-.3522.4797-.3218.686.0608 1.5179.1032 2.2767.1578 1.6514.0972 2.4468.255h.3886l.0546-.1579-.1336-.0971-.1032-.0972L6.973 9.8356l-2.55-1.6879-1.3356-.9714-.7225-.4918-.3643-.4614-.1578-1.0078.6557-.7225.8803.0607.2246.0607.8925.686 1.9064 1.4754 2.4893 1.8336.3643.3035.1457-.1032.0182-.0728-.164-.2733-1.3539-2.4467-1.445-2.4893-.6435-1.032-.17-.6194c-.0607-.255-.1032-.4674-.1032-.7285L6.287.1335 6.6997 0l.9957.1336.419.3642.6192 1.4147 1.0018 2.2282 1.5543 3.0296.4553.8985.2429.8318.091.255h.1579v-.1457l.1275-1.706.2368-2.0947.2307-2.6957.0789-.7589.3764-.9107.7468-.4918.5828.2793.4797.686-.0668.4433-.2853 1.8517-.5586 2.9021-.3643 1.9429h.2125l.2429-.2429.9835-1.3053 1.6514-2.0643.7286-.8196.85-.9046.5464-.4311h1.0321l.759 1.1293-.34 1.1657-1.0625 1.3478-.8804 1.1414-1.2628 1.7-.7893 1.36.0729.1093.1882-.0183 2.8535-.607 1.5421-.2794 1.8396-.3157.8318.3886.091.3946-.3278.8075-1.967.4857-2.3072.4614-3.4364.8136-.0425.0304.0486.0607 1.5482.1457.6618.0364h1.621l3.0175.2247.7892.522.4736.6376-.079.4857-1.2142.6193-1.6393-.3886-3.825-.9107-1.3113-.3279h-.1822v.1093l1.0929 1.0686 2.0035 1.8092 2.5075 2.3314.1275.5768-.3218.4554-.34-.0486-2.2039-1.6575-.85-.7468-1.9246-1.621h-.1275v.17l.4432.6496 2.3436 3.5214.1214 1.0807-.17.3521-.6071.2125-.6679-.1214-1.3721-1.9246L14.38 17.959l-1.1414-1.9428-.1397.079-.674 7.2552-.3156.3703-.7286.2793-.6071-.4614-.3218-.7468.3218-1.4753.3886-1.9246.3157-1.53.2853-1.9004.17-.6314-.0121-.0425-.1397.0182-1.4328 1.9672-2.1796 2.9446-1.7243 1.8456-.4128.164-.7164-.3704.0667-.6618.4008-.5889 2.386-3.0357 1.4389-1.882.929-1.0868-.0062-.1579h-.0546l-6.3385 4.1164-1.1293.1457-.4857-.4554.0608-.7467.2307-.2429 1.9064-1.3114Z"/></svg>
    </button>
    <button id="tb-openai" type="button" class="icon" title="OpenAI" aria-label="OpenAI">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#111" d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z"/></svg>
    </button>
    </div>
    <span class="tb-sep"></span>
    <div class="tb-group">
    <button id="tb-trail" type="button" class="icon" title="Trail" aria-label="Trail">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="#1f6b4a" stroke-width="1.4" d="M2 12c2-4 3-4 5-6s3-2 7-4"/><circle cx="3" cy="12" r="1.2" fill="#1f6b4a"/><circle cx="8" cy="7" r="1.2" fill="#1f6b4a"/><circle cx="13" cy="3" r="1.2" fill="#1f6b4a"/></svg>
    </button>
    <button id="tb-runs" type="button" class="icon" title="Runs" aria-label="Runs">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="none" stroke="#1f4e79" stroke-width="1.4"/><path fill="#1f4e79" d="M8 4.5v4l2.6 1.6-.7 1.1L6.6 9.1V4.5z"/></svg>
    </button>
    <button id="tb-notes" type="button" class="icon" title="Notes" aria-label="Notes">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="#fff" stroke="#555" d="M3 2h7l3 3v9H3z"/><path fill="#f2c94c" d="M10 2v3h3"/><path stroke="#555" stroke-width="1" d="M5 8h6M5 10.5h6M5 13h4"/></svg>
    </button>
    </div>
    <span class="tb-sep"></span>
    <span id="tb-case">No case</span>
  </header>
  <div id="workspace">
  <aside id="case-pane">
    <details open>
      <summary>Case</summary>
      <input id="case" value="" placeholder="No case loaded">
      <label for="analyst">Analyst</label>
      <input id="analyst" placeholder="Name on the trail">
      <button id="refresh" class="icon" title="Refresh case" aria-label="Refresh case">↻</button>
      <dl id="summary"></dl>
    </details>
    <details open>
      <summary>Hosts</summary>
      <ul id="hosts"></ul>
    </details>
    <details open>
      <summary>Hunts</summary>
      <label for="tactic">Tactic</label>
      <select id="tactic"></select>
      <label for="technique">Technique</label>
      <select id="technique"></select>
      <ul id="hunts"></ul>
    </details>
  </aside>
  <div class="split" id="split-left" title="Drag to resize"></div>
  <main>
    <section class="editor">
      <header>
        <span class="pane-title">SQL Editor</span>
        <span class="editor-actions">
          <button id="save-query" class="icon" title="Save query" aria-label="Save query">💾</button>
          <button id="run" class="icon" title="Run" aria-label="Run">▶</button>
        </span>
      </header>
      <div class="editor-body">
        <pre id="lines" class="lines" aria-hidden="true">1</pre>
        <textarea id="sql" spellcheck="false">SELECT event_id, count(*) AS count
FROM events
GROUP BY event_id
ORDER BY count DESC
LIMIT 20</textarea>
      </div>
    </section>
    <section class="results">
      <header>
        <span class="pane-title">Results</span>
        <span id="status">Ready</span>
        <button id="export" class="icon" title="Export CSV" aria-label="Export CSV">⬇</button>
      </header>
      <div id="results"></div>
    </section>
  </main>
  <div class="split" id="split-right" title="Drag to resize"></div>
  <aside id="grok" class="chat" hidden>
    <h1>AI Model</h1>
    <select id="vendor">
      <option value="grok">Grok</option>
      <option value="claude">Claude</option>
      <option value="openai">OpenAI</option>
    </select>
    <p id="models"></p>
    <div id="transcript"></div>
    <label for="ask">Ask</label>
    <textarea id="ask" placeholder="Ask about this case"></textarea>
    <button id="send" class="icon" title="Ask" aria-label="Ask">➤</button>
  </aside>
  <div id="handoff-sheet" class="sheet" hidden>
    <form id="handoff-form">
      <h1>Handoff password</h1>
      <input id="handoff-password" type="password" placeholder="At least 8 characters">
      <div class="sheet-actions">
        <button type="button" id="handoff-cancel">Cancel</button>
        <button type="submit" id="handoff-ok">Encrypt</button>
      </div>
    </form>
  </div>
  <div id="note-sheet" class="sheet" hidden>
    <form id="note-form">
      <h1>Note</h1>
      <input id="note-record" placeholder="Record id">
      <textarea id="note-body" placeholder="Sentence"></textarea>
      <div class="sheet-actions">
        <button type="button" id="note-cancel">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </div>
  <div id="query-sheet" class="sheet" hidden>
    <form id="query-form">
      <h1>Save query</h1>
      <input id="query-name" autocomplete="off">
      <div class="sheet-actions">
        <button type="button" id="query-cancel">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </div>
  <div id="case-sheet" class="sheet" hidden>
    <form id="case-form">
      <h1>Case name</h1>
      <input id="case-name" placeholder="DPW-AUS-pVnn0Tq" required>
      <div class="sheet-actions">
        <button type="button" id="case-cancel">Cancel</button>
        <button type="submit">Save case</button>
      </div>
    </form>
  </div>
  <div id="sheet" class="sheet" hidden>
    <form id="key-form">
      <h1>Connect Grok</h1>
      <p id="key-hint">The key is encrypted on this machine.</p>
      <input id="key" type="password" autocomplete="off">
      <div class="sheet-actions">
        <button type="button" id="key-cancel">Cancel</button>
        <button type="submit" id="key-save">Save</button>
      </div>
    </form>
  </div>
  <div id="loading" class="loading" hidden>
    <div class="loading-card">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loading-label">Loading collection</p>
      <p id="loading-pct">0%</p>
      <div class="loading-bar" aria-hidden="true"><span id="loading-fill"></span></div>
    </div>
  </div>
  </div>
  <div id="ioc-sheet" class="sheet" hidden>
    <form id="ioc-form">
      <h1 id="ioc-title">Add IOC</h1>
      <label for="ioc-kind">Kind</label>
      <select id="ioc-kind">
        <option value="sha1">SHA1</option>
        <option value="ip">IP</option>
        <option value="user">User</option>
        <option value="path">Path</option>
        <option value="domain">Domain</option>
      </select>
      <label for="ioc-value">Value</label>
      <input id="ioc-value" required autocomplete="off">
      <label for="ioc-note">Note</label>
      <input id="ioc-note" autocomplete="off">
      <input id="ioc-id" type="hidden">
      <div class="sheet-actions">
        <button type="button" id="ioc-cancel">Cancel</button>
        <button type="submit" id="ioc-save">Save</button>
      </div>
    </form>
  </div>
  <div id="ioc-list-sheet" class="sheet" hidden>
    <form id="ioc-list-form">
      <h1 id="ioc-list-title">IOCs</h1>
      <ul id="ioc-list"></ul>
      <div class="sheet-actions">
        <button type="button" id="ioc-list-cancel">Close</button>
      </div>
    </form>
  </div>
  <script src="hunts.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
