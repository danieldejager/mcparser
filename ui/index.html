<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>McParser</title>
  <link rel="stylesheet" href="studio.css">
</head>
<body>
  <aside id="case-pane">
    <details open>
      <summary>Case</summary>
      <input id="case" value="" placeholder="No case loaded">
      <label for="analyst">Analyst</label>
      <input id="analyst" placeholder="Name on the trail">
      <button id="refresh">Refresh case</button>
      <dl id="summary"></dl>
    </details>
    <details open>
      <summary>Hosts</summary>
      <ul id="hosts"></ul>
    </details>
    <details open>
      <summary>Hunts</summary>
      <label for="tactic">Tactic</label>
      <select id="tactic"></select>
      <label for="technique">Technique</label>
      <select id="technique"></select>
      <ul id="hunts"></ul>
    </details>
  </aside>
  <div class="split" id="split-left" title="Drag to resize"></div>
  <main>
    <section class="editor">
      <header>
        <span class="pane-title">SQL Editor</span>
        <span class="editor-actions">
          <button id="save-query">Save query</button>
          <button id="run">Run</button>
        </span>
      </header>
      <div class="editor-body">
        <pre id="lines" class="lines" aria-hidden="true">1</pre>
        <textarea id="sql" spellcheck="false">SELECT event_id, count(*) AS count
FROM events
GROUP BY event_id
ORDER BY count DESC
LIMIT 20</textarea>
      </div>
    </section>
    <section class="results">
      <header>
        <span class="pane-title">Results</span>
        <span id="status">Ready</span>
        <button id="note">Note</button>
        <button id="export">Export CSV</button>
      </header>
      <div id="results"></div>
    </section>
  </main>
  <div class="split" id="split-right" title="Drag to resize"></div>
  <aside id="grok" class="chat" hidden>
    <h1>AI Model</h1>
    <select id="vendor">
      <option value="grok">Grok</option>
      <option value="claude">Claude</option>
      <option value="openai">OpenAI</option>
    </select>
    <p id="models"></p>
    <div id="transcript"></div>
    <label for="ask">Ask</label>
    <textarea id="ask" placeholder="Ask about this case"></textarea>
    <button id="send">Ask</button>
  </aside>
  <div id="handoff-sheet" class="sheet" hidden>
    <form id="handoff-form">
      <h1>Handoff password</h1>
      <input id="handoff-password" type="password" placeholder="At least 8 characters">
      <div class="sheet-actions">
        <button type="button" id="handoff-cancel">Cancel</button>
        <button type="submit" id="handoff-ok">Encrypt</button>
      </div>
    </form>
  </div>
  <div id="note-sheet" class="sheet" hidden>
    <form id="note-form">
      <h1>Note</h1>
      <input id="note-record" placeholder="Record id">
      <textarea id="note-body" placeholder="Sentence"></textarea>
      <div class="sheet-actions">
        <button type="button" id="note-cancel">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </div>
  <div id="query-sheet" class="sheet" hidden>
    <form id="query-form">
      <h1>Save query</h1>
      <input id="query-name" autocomplete="off">
      <div class="sheet-actions">
        <button type="button" id="query-cancel">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </div>
  <div id="case-sheet" class="sheet" hidden>
    <form id="case-form">
      <h1>Case name</h1>
      <input id="case-name" placeholder="DPW-AUS-pVnn0Tq" required>
      <div class="sheet-actions">
        <button type="button" id="case-cancel">Cancel</button>
        <button type="submit">Save case</button>
      </div>
    </form>
  </div>
  <div id="sheet" class="sheet" hidden>
    <form id="key-form">
      <h1>Connect Grok</h1>
      <p id="key-hint">The key is encrypted on this machine.</p>
      <input id="key" type="password" autocomplete="off">
      <div class="sheet-actions">
        <button type="button" id="key-cancel">Cancel</button>
        <button type="submit" id="key-save">Save</button>
      </div>
    </form>
  </div>
  <div id="loading" class="loading" hidden>
    <div class="loading-card">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loading-label">Loading collection</p>
      <p id="loading-pct">0%</p>
      <div class="loading-bar" aria-hidden="true"><span id="loading-fill"></span></div>
    </div>
  </div>
  <script src="hunts.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
