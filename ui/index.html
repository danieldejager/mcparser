<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>McParser</title>
  <link rel="stylesheet" href="studio.css">
</head>
<body>
  <header id="toolbar">
    <div class="tb-group">
    <button id="tb-open" type="button" class="icon" title="Open Collection" aria-label="Open Collection">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="#f2c94c" d="M1 4h5l1.5 1.5H15V13H1z"/><path fill="#f6d56b" d="M1 5.5h14V13H1z"/><path fill="#e0a82e" d="M1 4h5l1 1H1z"/></svg>
    </button>
    <button id="tb-new" type="button" class="icon" title="New Query" aria-label="New Query">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="#fff" stroke="#555" d="M3 1h7l3 3v11H3z"/><path fill="#f2c94c" d="M10 1v3h3"/><path fill="#f2c94c" d="M8 5l.7 1.6 1.8.2-1.3 1.2.4 1.8L8 9l-1.6.8.4-1.8-1.3-1.2 1.8-.2z"/></svg>
    </button>
    <button id="tb-save" type="button" class="icon" title="Save" aria-label="Save">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="#2f6db5" d="M2 2h9l3 3v9H2z"/><path fill="#fff" d="M4 2h6v4H4z"/><path fill="#d6e6f7" d="M4 9h8v5H4z"/><path fill="#2f6db5" d="M5 10h6v1H5zM5 12h6v1H5z"/></svg>
    </button>
    <button id="tb-save-all" type="button" class="icon" title="Save all" aria-label="Save all">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="#8fb4dd" d="M4 1h7l2 2v9H4z"/><path fill="#2f6db5" d="M2 4h9l2 2v8H2z"/><path fill="#fff" d="M4 4h5v3H4z"/><path fill="#d6e6f7" d="M4 9h7v4H4z"/></svg>
    </button>
    <button id="tb-run" type="button" class="icon" title="Execute" aria-label="Execute">▶</button>
    </div>
    <span class="tb-sep"></span>
    <span id="tb-case">No case</span>
  </header>
  <div id="workspace">
  <aside id="case-pane">
    <details open>
      <summary>Case</summary>
      <input id="case" value="" placeholder="No case loaded">
      <label for="analyst">Analyst</label>
      <input id="analyst" placeholder="Name on the trail">
      <button id="refresh" class="icon" title="Refresh case" aria-label="Refresh case">↻</button>
      <dl id="summary"></dl>
    </details>
    <details open>
      <summary>Hosts</summary>
      <ul id="hosts"></ul>
    </details>
    <details open>
      <summary>Hunts</summary>
      <label for="tactic">Tactic</label>
      <select id="tactic"></select>
      <label for="technique">Technique</label>
      <select id="technique"></select>
      <ul id="hunts"></ul>
    </details>
  </aside>
  <div class="split" id="split-left" title="Drag to resize"></div>
  <main>
    <section class="editor">
      <header>
        <span class="pane-title">SQL Editor</span>
        <span class="editor-actions">
          <button id="save-query" class="icon" title="Save query" aria-label="Save query">💾</button>
          <button id="run" class="icon" title="Run" aria-label="Run">▶</button>
        </span>
      </header>
      <div class="editor-body">
        <pre id="lines" class="lines" aria-hidden="true">1</pre>
        <textarea id="sql" spellcheck="false">SELECT event_id, count(*) AS count
FROM events
GROUP BY event_id
ORDER BY count DESC
LIMIT 20</textarea>
      </div>
    </section>
    <section class="results">
      <header>
        <span class="pane-title">Results</span>
        <span id="status">Ready</span>
        <button id="export" class="icon" title="Export CSV" aria-label="Export CSV">⬇</button>
      </header>
      <div id="results"></div>
    </section>
  </main>
  <div class="split" id="split-right" title="Drag to resize"></div>
  <aside id="grok" class="chat" hidden>
    <h1>AI Model</h1>
    <select id="vendor">
      <option value="grok">Grok</option>
      <option value="claude">Claude</option>
      <option value="openai">OpenAI</option>
    </select>
    <p id="models"></p>
    <div id="transcript"></div>
    <label for="ask">Ask</label>
    <textarea id="ask" placeholder="Ask about this case"></textarea>
    <button id="send" class="icon" title="Ask" aria-label="Ask">➤</button>
  </aside>
  <div id="handoff-sheet" class="sheet" hidden>
    <form id="handoff-form">
      <h1>Handoff password</h1>
      <input id="handoff-password" type="password" placeholder="At least 8 characters">
      <div class="sheet-actions">
        <button type="button" id="handoff-cancel">Cancel</button>
        <button type="submit" id="handoff-ok">Encrypt</button>
      </div>
    </form>
  </div>
  <div id="note-sheet" class="sheet" hidden>
    <form id="note-form">
      <h1>Note</h1>
      <input id="note-record" placeholder="Record id">
      <textarea id="note-body" placeholder="Sentence"></textarea>
      <div class="sheet-actions">
        <button type="button" id="note-cancel">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </div>
  <div id="query-sheet" class="sheet" hidden>
    <form id="query-form">
      <h1>Save query</h1>
      <input id="query-name" autocomplete="off">
      <div class="sheet-actions">
        <button type="button" id="query-cancel">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </div>
  <div id="case-sheet" class="sheet" hidden>
    <form id="case-form">
      <h1>Case name</h1>
      <input id="case-name" placeholder="DPW-AUS-pVnn0Tq" required>
      <div class="sheet-actions">
        <button type="button" id="case-cancel">Cancel</button>
        <button type="submit">Save case</button>
      </div>
    </form>
  </div>
  <div id="sheet" class="sheet" hidden>
    <form id="key-form">
      <h1>Connect Grok</h1>
      <p id="key-hint">The key is encrypted on this machine.</p>
      <input id="key" type="password" autocomplete="off">
      <div class="sheet-actions">
        <button type="button" id="key-cancel">Cancel</button>
        <button type="submit" id="key-save">Save</button>
      </div>
    </form>
  </div>
  <div id="loading" class="loading" hidden>
    <div class="loading-card">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loading-label">Loading collection</p>
      <p id="loading-pct">0%</p>
      <div class="loading-bar" aria-hidden="true"><span id="loading-fill"></span></div>
    </div>
  </div>
  </div>
  <div id="ioc-sheet" class="sheet" hidden>
    <form id="ioc-form">
      <h1 id="ioc-title">Add IOC</h1>
      <label for="ioc-kind">Kind</label>
      <select id="ioc-kind">
        <option value="sha1">SHA1</option>
        <option value="ip">IP</option>
        <option value="user">User</option>
        <option value="path">Path</option>
        <option value="domain">Domain</option>
      </select>
      <label for="ioc-value">Value</label>
      <input id="ioc-value" required autocomplete="off">
      <label for="ioc-note">Note</label>
      <input id="ioc-note" autocomplete="off">
      <input id="ioc-id" type="hidden">
      <div class="sheet-actions">
        <button type="button" id="ioc-cancel">Cancel</button>
        <button type="submit" id="ioc-save">Save</button>
      </div>
    </form>
  </div>
  <div id="ioc-list-sheet" class="sheet" hidden>
    <form id="ioc-list-form">
      <h1 id="ioc-list-title">IOCs</h1>
      <ul id="ioc-list"></ul>
      <div class="sheet-actions">
        <button type="button" id="ioc-list-cancel">Close</button>
      </div>
    </form>
  </div>
  <script src="hunts.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
