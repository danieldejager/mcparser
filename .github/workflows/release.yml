name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag is on main
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Dispatch is from main
        if: github.event_name == 'workflow_dispatch'
        run: test "${GITHUB_REF}" = "refs/heads/main"
      - uses: dtolnay/rust-toolchain@stable
      - name: Download the Security fixture
        run: |
          mkdir -p fixtures/evtx
          wget -O fixtures/evtx/security.evtx             https://github.com/omerbenamram/evtx/raw/master/samples/security.evtx
      - name: Test the parser
        run: cargo test

  security:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: Semgrep
        run: |
          python3 -m pip install semgrep
          semgrep scan --config p/javascript --config p/rust --error
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript, rust
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          # Same category in test.yml and release.yml so both upload to the
          # one CodeQL configuration main already has.
          category: ".github/workflows/test.yml:security"

  macos:
    needs: [test, security]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the parser
        run: cargo build -p mcparser --release
      - name: Check for signing secrets
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::macOS build is UNSIGNED and not notarized (missing secrets:$missing)"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "macOS build will be signed with Developer ID and notarized"
          fi
      - name: Pack the disk image (unsigned)
        if: steps.signing.outputs.signed != 'true'
        working-directory: ui
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          echo "Building an UNSIGNED macOS disk image"
          npm install
          npm run dist
      - name: Write the App Store Connect key
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          set +x
          key_path="$RUNNER_TEMP/AuthKey.p8"
          umask 077
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - name: Pack, sign and notarize the disk image
        if: steps.signing.outputs.signed == 'true'
        working-directory: ui
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set +x
          echo "::add-mask::$APPLE_API_KEY_ID"
          echo "::add-mask::$APPLE_API_ISSUER"
          echo "::add-mask::$APPLE_TEAM_ID"
          export APPLE_API_KEY="$APPLE_API_KEY_PATH"
          npm install
          # identity null in package.json keeps local and fork builds unsigned.
          # Override it here with the team ID, which matches the
          # "Developer ID Application: Name (TEAMID)" identity from CSC_LINK.
          # electron-builder signs with hardened runtime and notarizes and
          # staples the app via notarytool using the APPLE_API_* variables.
          npx electron-builder --mac dmg -c.mac.identity="$APPLE_TEAM_ID"
      - name: Notarize and staple the disk image
        if: steps.signing.outputs.signed == 'true'
        working-directory: ui
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set +x
          for dmg in dist/*.dmg; do
            xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done
          app="$(ls -d dist/mac*/*.app | head -n 1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose "$app"
      - name: Remove the App Store Connect key
        if: always() && steps.signing.outputs.signed == 'true'
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
      - name: Attach the disk image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ui/dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    needs: [test, security]
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the parser
        run: cargo build -p mcparser --release
      - name: Pack the installer
        working-directory: ui
        run: |
          npm install
          npm run dist:win
      - name: Attach the installer
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ui/dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ubuntu:
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the parser
        run: cargo build -p mcparser --release
      - name: Pack the deb
        working-directory: ui
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg
          npm install
          npm run dist:linux
      - name: Attach the deb
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ui/dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ubuntu-arm:
    needs: [test, security]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the parser
        run: cargo build -p mcparser --release
      - name: Pack the arm64 deb
        working-directory: ui
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg ruby ruby-dev build-essential
          sudo gem install fpm
          npm install
          USE_SYSTEM_FPM=true npm run dist:linux
      - name: Attach the arm64 deb
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ui/dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    needs: [test, security]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate the CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json
          # cargo-cyclonedx writes one <crate>.cdx.json per crate, next to
          # each Cargo.toml. The mcparser binary SBOM is in crates/cli.
          test -f crates/cli/mcparser.cdx.json
          cp crates/cli/mcparser.cdx.json mcparser.cdx.json
      - name: Attach the SBOM
        uses: softprops/action-gh-release@v2
        with:
          files: mcparser.cdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checksums:
    needs: [macos, windows, ubuntu, ubuntu-arm, sbom]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download the release assets
        run: |
          gh release download "${GITHUB_REF_NAME}" --dir assets --repo "${GITHUB_REPOSITORY}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Write SHA256SUMS
        run: |
          cd assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attach SHA256SUMS
        uses: softprops/action-gh-release@v2
        with:
          files: assets/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
