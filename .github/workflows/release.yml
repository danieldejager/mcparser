name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag is on main
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Dispatch is from main
        if: github.event_name == 'workflow_dispatch'
        run: test "${GITHUB_REF}" = "refs/heads/main"
      - uses: dtolnay/rust-toolchain@stable
      - name: Download the Security fixture
        run: |
          mkdir -p fixtures/evtx
          wget -O fixtures/evtx/security.evtx             https://github.com/omerbenamram/evtx/raw/master/samples/security.evtx
      - name: Test the parser
        run: cargo test

  security:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: Semgrep
        run: |
          python3 -m pip install semgrep
          semgrep scan --config p/javascript --config p/rust --error
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript, rust
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  macos:
    needs: [test, security]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the parser
        run: cargo build -p mcparser --release
      - name: Pack the disk image
        working-directory: ui
        run: |
          npm install
          npm run dist
      - name: Attach the disk image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ui/dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    needs: [test, security]
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the parser
        run: cargo build -p mcparser --release
      - name: Pack the installer
        working-directory: ui
        run: |
          npm install
          npm run dist:win
      - name: Attach the installer
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ui/dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ubuntu:
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the parser
        run: cargo build -p mcparser --release
      - name: Pack the deb
        working-directory: ui
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg
          npm install
          npm run dist:linux
      - name: Attach the deb
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ui/dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ubuntu-arm:
    needs: [test, security]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the parser
        run: cargo build -p mcparser --release
      - name: Pack the arm64 deb
        working-directory: ui
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg ruby ruby-dev build-essential
          sudo gem install fpm
          npm install
          USE_SYSTEM_FPM=true npm run dist:linux
      - name: Attach the arm64 deb
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ui/dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
