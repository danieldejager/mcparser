name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Download the Security fixture
        run: |
          mkdir -p fixtures/evtx
          wget -O fixtures/evtx/security.evtx \
            https://github.com/omerbenamram/evtx/raw/master/samples/security.evtx
      - name: Test the parser
        run: cargo test
