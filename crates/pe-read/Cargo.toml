[package]
name = "pe-read"
version.workspace = true
edition.workspace = true
license.workspace = true

# Parse only. This crate reads bytes and decodes PE headers and tables.
# It never executes, loads, maps or disassembles the input.
[dependencies]
# Authenticode: RustCrypto DER/X.509/CMS decoders, pure Rust, no_std capable,
# no unsafe in their decode paths. Parse only; nothing here verifies signatures.
cms = { version = "=0.2.3", default-features = false }
der = { version = "=0.7.10", default-features = false }
md-5 = "=0.10.6"
sha1 = "=0.10.6"
sha2 = "=0.10.9"
x509-cert = { version = "=0.2.5", default-features = false }
